<!doctype html>
<html lang="en">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <nav class="sidebar">
      <h1>API Reference</h1>
      <ul class="group-tree">{{GROUP_TREE}}</ul>

    <main class="content">

    </main>
  </div>

</html>
